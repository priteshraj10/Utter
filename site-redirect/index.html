<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Utter has moved</title>
    <link rel="canonical" href="https://utter-app.github.io/" />
    <meta http-equiv="refresh" content="0; url=https://utter-app.github.io/" />
    <meta name="robots" content="noindex" />
    <script>
      // Keep any hash so deep links to sections survive the move.
      window.location.replace(
        "https://utter-app.github.io/" + window.location.hash,
      );
    </script>
  </head>
  <body>
    <p>
      Utter has moved to
      <a href="https://utter-app.github.io/">utter-app.github.io</a>.
    </p>
  </body>
</html>
